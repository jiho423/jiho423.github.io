<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>관리자 · 캠페인파트너팀</title>
<style>
  :root {
    --ground:#0c1215; --card:#131b1f; --ink:#eef3f5; --muted:#8a979d; --line:#233038;
    --accent:#5ac5de; --danger:#e2685f; --ok:#5ec27a;
    --font:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:var(--font); background:var(--ground); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased; }
  a { color:var(--accent); }
  button { font:inherit; cursor:pointer; }
  input, textarea, select { font:inherit; }
  .wrap { max-width:1080px; margin:0 auto; padding:24px clamp(16px,4vw,40px) 120px; }

  /* 로그인 */
  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; }
  .login-card h1 { font-size:20px; font-weight:600; margin-bottom:4px; }
  .login-card p { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .field input, .field textarea, .field select {
    background:var(--ground); border:1px solid var(--line); border-radius:9px; color:var(--ink);
    padding:11px 12px; outline:none; width:100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent); }
  .btn { background:var(--accent); color:#0c1215; border:none; border-radius:9px; padding:11px 16px; font-weight:600; }
  .btn:hover { filter:brightness(1.05); }
  .btn.ghost { background:none; border:1px solid var(--line); color:var(--ink); }
  .btn.ghost:hover { border-color:var(--accent); }
  .btn.sm { padding:7px 12px; font-size:13px; font-weight:500; }
  .btn.danger { background:none; border:1px solid color-mix(in srgb,var(--danger) 50%,transparent); color:var(--danger); }
  .msg { font-size:13px; margin-top:12px; min-height:18px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }

  /* 상단바 */
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .topbar b { font-weight:600; } .topbar .who { color:var(--muted); font-size:13px; }

  /* 목록 */
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .list { display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:11px; padding:12px 14px; }
  .row .idx { color:var(--muted); font-size:13px; width:26px; font-variant-numeric:tabular-nums; }
  .row .nm { flex:1; font-weight:500; min-width:0; }
  .row .nm small { display:block; color:var(--muted); font-weight:400; font-size:12px; }
  .row .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .move { display:flex; flex-direction:column; gap:2px; }
  .move button { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; width:24px; height:18px; line-height:1; font-size:11px; }
  .empty { color:var(--muted); text-align:center; padding:48px; border:1px dashed var(--line); border-radius:12px; }

  /* 편집 폼 */
  .editor { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:clamp(18px,3vw,28px); }
  .editor h2 { font-size:17px; font-weight:600; margin-bottom:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .types { display:flex; flex-wrap:wrap; gap:8px; }
  .chip-toggle { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:40px; padding:6px 12px; font-size:13px; color:var(--muted); user-select:none; }
  .chip-toggle input { display:none; }
  .chip-toggle.on { color:#0c1215; border-color:transparent; }
  .imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .imgcard { background:var(--ground); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .imgcard img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#1a2329; }
  .imgcard .cap { padding:8px; }
  .imgcard .cap input { width:100%; background:none; border:none; border-bottom:1px solid var(--line); color:var(--ink); font-size:12px; padding:3px 0; outline:none; }
  .imgcard .cap .rm { color:var(--danger); font-size:12px; background:none; border:none; margin-top:6px; padding:0; }
  .drop { border:1px dashed var(--line); border-radius:10px; padding:22px; text-align:center; color:var(--muted); font-size:13px; }
  .drop.hot { border-color:var(--accent); color:var(--ink); }
  .actions { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid #0c1215; border-top-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (max-width:620px){ .grid2 { grid-template-columns:1fr; } }

  [hidden] { display:none !important; }
</style>

<!-- ================= 로그인 ================= -->
<div id="login">
  <form class="login-card" id="loginForm">
    <h1>캠페인파트너팀 관리자</h1>
    <p>등록된 이메일로 로그인하세요.</p>
    <div class="field"><label>이메일</label><input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label>비밀번호</label><input type="password" id="pw" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%" id="loginBtn" type="submit">로그인</button>
    <div class="msg err" id="loginMsg"></div>
  </form>
</div>

<!-- ================= 앱 ================= -->
<div id="app" hidden>
  <div class="wrap">
    <div class="topbar">
      <div><b>캠페인파트너팀</b> · 관리자 <span class="who" id="who"></span></div>
      <div style="display:flex; gap:8px;">
        <a class="btn ghost sm" href="https://jiho423.github.io" target="_blank" style="text-decoration:none">사이트 보기 ↗</a>
        <button class="btn ghost sm" id="logoutBtn">로그아웃</button>
      </div>
    </div>

    <!-- 목록 -->
    <div id="listView">
      <div class="toolbar">
        <button class="btn" id="newBtn">+ 새 캠페인</button>
      </div>
      <div class="list" id="list"></div>
      <div class="msg" id="listMsg"></div>
    </div>

    <!-- 편집 -->
    <div id="editView" hidden>
      <div class="editor">
        <h2 id="editTitle">캠페인 편집</h2>
        <div class="grid2">
          <div class="field"><label>캠페인명</label><input id="f_name" placeholder="티머니GO 활성화 캠페인"></div>
          <div class="field"><label>Client</label><input id="f_client" placeholder="티머니"></div>
          <div class="field"><label>Agency</label><input id="f_agency" placeholder="51percent, 대학내일, 위베러"></div>
          <div class="field"><label>Solution</label><input id="f_solution" placeholder="Digital Campaign, Content, Media Planning"></div>
          <div class="field"><label>Industry</label><input id="f_industry" placeholder="전자/IT, 모빌리티"></div>
          <div class="field"><label>Date (표시용)</label><input id="f_date" placeholder="2024. 09"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>연도 (목록·필터용)</label><input id="f_year" placeholder="2024"></div>
          <div class="field"><label>카테고리 (목록 부제)</label><input id="f_category" placeholder="공공·캠페인"></div>
        </div>
        <div class="field"><label>타입 (필터 칩 · 여러 개 선택)</label><div class="types" id="f_types"></div></div>
        <div class="field"><label>링크 (1~4개)</label><div id="f_links" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn ghost sm" id="addLink" type="button" style="margin-top:10px;align-self:flex-start">+ 링크 추가</button></div>
        <div class="field"><label>설명</label><textarea id="f_body" rows="6" placeholder="캠페인 소개..."></textarea></div>

        <div class="field">
          <label>이미지</label>
          <div class="drop" id="drop">이미지·영상을 여기로 드래그하거나 <label style="color:var(--accent); cursor:pointer">파일 선택<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden></label><br><small style="color:var(--muted)">가로(16:9)는 한 줄 꽉, 세로·정사각(9:16·4:5)은 2개씩 자동 배치돼요</small></div>
          <div class="imgs" id="imgs" style="margin-top:12px"></div>
        </div>

        <div class="actions">
          <button class="btn" id="saveBtn">저장</button>
          <button class="btn ghost" id="cancelBtn">취소</button>
          <button class="btn ghost" id="pdfBtn" style="margin-left:auto">PDF 내보내기 (1920×1080)</button>
        </div>
        <div class="msg" id="editMsg"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  const SUPABASE_URL = 'https://qsyyrbgoqhmtkskjcvnd.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzeXlyYmdvcWhtdGtza2pjdm5kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNzc1NjAsImV4cCI6MjEwMDY1MzU2MH0.OBr9R8iNy2g1lxBAqsYk8Zr0E4xEbIlLFRp1Xx2ZUSM';
  const TYPES = ['Film','Digital','Brand','Identity','Space','Social','OOH','Package'];
  const TYPE_COLORS = { Film:'#8fd98a', Digital:'#93b4f0', Brand:'#c3a2f0', Identity:'#e6cf76', Space:'#e79ec7', Social:'#7bd0c4', OOH:'#f0aa77', Package:'#cbb391' };
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const $ = id => document.getElementById(id);
  const loginView = $('login'), appView = $('app');
  let editing = null;      // 현재 편집 중인 캠페인 객체
  let curImages = [];      // [{path, url, caption, type, w, h}]
  let curLinks = [];       // [{label, url}]

  /* ---------- 인증 ---------- */
  async function boot() {
    const { data } = await sb.auth.getSession();
    if (data.session) showApp(data.session.user); else showLogin();
  }
  function showLogin() { loginView.hidden = false; appView.hidden = true; }
  function showApp(user) { loginView.hidden = true; appView.hidden = false; $('who').textContent = '· ' + (user?.email || ''); loadList(); }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('loginMsg').textContent = ''; $('loginBtn').disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
    $('loginBtn').disabled = false;
    if (error) { $('loginMsg').className = 'msg err'; $('loginMsg').textContent = '로그인 실패: 이메일/비밀번호를 확인하세요.'; return; }
    showApp(data.user);
  });
  $('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

  /* ---------- 목록 ---------- */
  async function loadList() {
    $('listMsg').textContent = '불러오는 중…';
    const { data, error } = await sb.from('projects').select('*').order('sort', { ascending: false });
    if (error) { $('listMsg').className='msg err'; $('listMsg').textContent = 'DB 오류: 테이블이 만들어졌는지 확인하세요. (' + error.message + ')'; return; }
    $('listMsg').textContent = '';
    const list = $('list');
    if (!data.length) { list.innerHTML = `<div class="empty">아직 캠페인이 없어요. <b>+ 새 캠페인</b> 또는 <b>샘플 20개 불러오기</b>로 시작하세요.</div>`; return; }
    list.innerHTML = data.map((p, i) => `
      <div class="row" data-id="${p.id}">
        <span class="idx">${String(data.length - i).padStart(2,'0')}</span>
        <div class="move"><button data-mv="up" ${i===0?'disabled':''}>▲</button><button data-mv="down" ${i===data.length-1?'disabled':''}>▼</button></div>
        <div class="nm">${esc(p.name) || '(제목 없음)'}<small>${esc(p.client)} · ${esc(p.year)} · ${(p.types||[]).join(', ')}</small></div>
        <div class="acts">
          <button class="btn ghost sm" data-act="edit">수정</button>
          <button class="btn danger sm" data-act="del">삭제</button>
        </div>
      </div>`).join('');
    list.querySelectorAll('.row').forEach((row, i) => {
      const p = data[i];
      row.querySelector('[data-act="edit"]').onclick = () => openEditor(p);
      row.querySelector('[data-act="del"]').onclick = () => delProject(p);
      row.querySelector('[data-mv="up"]').onclick = () => swapSort(data, i, i-1);
      row.querySelector('[data-mv="down"]').onclick = () => swapSort(data, i, i+1);
    });
  }
  async function swapSort(data, a, b) {
    if (b<0 || b>=data.length) return;
    const A = data[a], B = data[b];
    await sb.from('projects').update({ sort: B.sort }).eq('id', A.id);
    await sb.from('projects').update({ sort: A.sort }).eq('id', B.id);
    loadList();
  }
  async function delProject(p) {
    if (!confirm(`"${p.name}" 캠페인을 삭제할까요?`)) return;
    await sb.from('projects').delete().eq('id', p.id);
    loadList();
  }

  /* ---------- 편집 ---------- */
  $('newBtn').onclick = () => openEditor(null);
  $('cancelBtn').onclick = () => { $('editView').hidden = true; $('listView').hidden = false; };

  function openEditor(p) {
    editing = p;
    $('editTitle').textContent = p ? '캠페인 편집' : '새 캠페인';
    $('f_name').value = p?.name || ''; $('f_client').value = p?.client || '';
    $('f_agency').value = p?.agency || ''; $('f_solution').value = p?.solution || '';
    $('f_industry').value = p?.industry || ''; $('f_date').value = p?.date_str || '';
    $('f_category').value = p?.category || ''; $('f_year').value = p?.year || '';
    $('f_body').value = p?.body || '';
    curLinks = (p?.links || []).map(l => ({ ...l }));
    renderLinks();
    // 타입 토글
    const sel = new Set(p?.types || []);
    $('f_types').innerHTML = TYPES.map(t => `<label class="chip-toggle ${sel.has(t)?'on':''}" style="${sel.has(t)?`background:${TYPE_COLORS[t]}`:''}"><input type="checkbox" value="${t}" ${sel.has(t)?'checked':''}>${t}</label>`).join('');
    $('f_types').querySelectorAll('input').forEach(cb => cb.onchange = () => {
      const lab = cb.closest('label');
      lab.classList.toggle('on', cb.checked);
      lab.style.background = cb.checked ? TYPE_COLORS[cb.value] : '';
    });
    curImages = (p?.images || []).map(x => ({ ...x }));
    renderImgs();
    $('editMsg').textContent = '';
    $('listView').hidden = true; $('editView').hidden = false; window.scrollTo(0,0);
  }

  function ratioLabel(im) {
    if (!im.w || !im.h) return '';
    const r = im.w / im.h;
    return r >= 1.2 ? '가로' : (r <= 0.85 ? '세로' : '정사각');
  }
  function renderImgs() {
    $('imgs').innerHTML = curImages.map((im, i) => `
      <div class="imgcard">
        ${im.type === 'video'
          ? `<video src="${im.url}" muted playsinline preload="metadata" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#1a2329"></video>`
          : `<img src="${im.url}" alt="">`}
        <div class="cap">
          <input placeholder="캡션 (예: Key Visual)" value="${esc(im.caption||'')}" data-i="${i}">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px">
            <span style="color:var(--muted); font-size:11px">${im.type==='video'?'🎬 영상':'🖼 이미지'}${ratioLabel(im)?' · '+ratioLabel(im):''}</span>
            <button class="rm" data-i="${i}">삭제</button>
          </div>
        </div>
      </div>`).join('');
    $('imgs').querySelectorAll('input').forEach(inp => inp.oninput = () => curImages[+inp.dataset.i].caption = inp.value);
    $('imgs').querySelectorAll('.rm').forEach(b => b.onclick = () => { curImages.splice(+b.dataset.i,1); renderImgs(); });
  }

  // 링크 에디터 (1~4개)
  function renderLinks() {
    $('f_links').innerHTML = curLinks.map((l, i) => `
      <div style="display:grid;grid-template-columns:1fr 1.6fr auto;gap:8px;align-items:center">
        <input placeholder="표시명 (예: 온다택시 편)" value="${esc(l.label||'')}" data-k="label" data-i="${i}" style="background:var(--ground);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 10px">
        <input placeholder="https://..." value="${esc(l.url||'')}" data-k="url" data-i="${i}" style="background:var(--ground);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 10px">
        <button class="btn danger sm" data-rm="${i}" type="button">삭제</button>
      </div>`).join('');
    $('f_links').querySelectorAll('input').forEach(inp => inp.oninput = () => curLinks[+inp.dataset.i][inp.dataset.k] = inp.value);
    $('f_links').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { curLinks.splice(+b.dataset.rm,1); renderLinks(); });
  }
  $('addLink').onclick = () => { if (curLinks.length >= 4) return; curLinks.push({ label:'', url:'' }); renderLinks(); };

  // 업로드
  const drop = $('drop');
  $('fileInput').onchange = e => uploadFiles(e.target.files);
  ['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('hot'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('hot'); }));
  drop.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));

  function mediaDims(file) {
    return new Promise(res => {
      const url = URL.createObjectURL(file);
      if (file.type.startsWith('video/')) {
        const v = document.createElement('video'); v.preload = 'metadata';
        v.onloadedmetadata = () => { res({ w: v.videoWidth, h: v.videoHeight }); URL.revokeObjectURL(url); };
        v.onerror = () => { res({ w: 0, h: 0 }); URL.revokeObjectURL(url); };
        v.src = url;
      } else {
        const im = new Image();
        im.onload = () => { res({ w: im.naturalWidth, h: im.naturalHeight }); URL.revokeObjectURL(url); };
        im.onerror = () => { res({ w: 0, h: 0 }); URL.revokeObjectURL(url); };
        im.src = url;
      }
    });
  }
  async function uploadFiles(files) {
    for (const file of files) {
      const isVid = file.type.startsWith('video/');
      if (!file.type.startsWith('image/') && !isVid) continue;
      $('editMsg').className = 'msg'; $('editMsg').innerHTML = `<span class="spin"></span> 업로드 중… ${file.name}`;
      const dims = await mediaDims(file);
      const path = `${Date.now()}-${Math.random().toString(36).slice(2,7)}-${file.name.replace(/[^\w.\-]/g,'_')}`;
      const { error } = await sb.storage.from('portfolio').upload(path, file, { cacheControl:'3600', upsert:false });
      if (error) { $('editMsg').className='msg err'; $('editMsg').textContent = '업로드 실패: ' + error.message; continue; }
      const { data } = sb.storage.from('portfolio').getPublicUrl(path);
      curImages.push({ path, url: data.publicUrl, caption: '', type: isVid ? 'video' : 'image', w: dims.w, h: dims.h });
      renderImgs();
    }
    $('editMsg').textContent = '';
  }

  // 저장
  $('saveBtn').onclick = async () => {
    const rec = {
      name: $('f_name').value.trim(), client: $('f_client').value.trim(),
      agency: $('f_agency').value.trim(), solution: $('f_solution').value.trim(),
      industry: $('f_industry').value.trim(), date_str: $('f_date').value.trim(),
      category: $('f_category').value.trim(), year: $('f_year').value.trim(),
      types: [...$('f_types').querySelectorAll('input:checked')].map(c => c.value),
      links: curLinks.filter(l => (l.label||'').trim() || (l.url||'').trim()).map(({label,url}) => ({label:label||'',url:url||''})),
      body: $('f_body').value, images: curImages.map(({path,url,caption,type,w,h}) => ({path,url,caption,type:type||'image',w:w||0,h:h||0})),
      updated_at: new Date().toISOString()
    };
    $('saveBtn').disabled = true; $('editMsg').className='msg'; $('editMsg').innerHTML = '<span class="spin"></span> 저장 중…';
    let res;
    if (editing) res = await sb.from('projects').update(rec).eq('id', editing.id);
    else {
      const { data } = await sb.from('projects').select('sort').order('sort',{ascending:false}).limit(1);
      rec.sort = (data && data[0] ? data[0].sort : 0) + 1;
      res = await sb.from('projects').insert(rec);
    }
    $('saveBtn').disabled = false;
    if (res.error) { $('editMsg').className='msg err'; $('editMsg').textContent = '저장 실패: ' + res.error.message; return; }
    $('editMsg').className='msg ok'; $('editMsg').textContent = '저장됐어요!';
    setTimeout(() => { $('editView').hidden = true; $('listView').hidden = false; loadList(); }, 500);
  };

  /* ---------- PDF (1920×1080) ---------- */
  $('pdfBtn').onclick = async () => {
    const p = {
      name: $('f_name').value, client: $('f_client').value, agency: $('f_agency').value,
      solution: $('f_solution').value, industry: $('f_industry').value,
      date_str: $('f_date').value, year: $('f_year').value, category: $('f_category').value,
      body: $('f_body').value, links: curLinks, images: curImages
    };
    $('editMsg').className='msg'; $('editMsg').innerHTML = '<span class="spin"></span> PDF 만드는 중…';
    try { await makePDF(p); $('editMsg').textContent=''; }
    catch (e) { $('editMsg').className='msg err'; $('editMsg').textContent = 'PDF 오류: ' + e.message; }
  };

  // 화면(HTML)을 캡처해 슬라이드로 → 한글 정상 렌더 + 디자인 유지
  const PFONT = "'Pretendard','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif";
  async function makePDF(p) {
    const { jsPDF } = window.jspdf;
    const W = 1920, H = 1080;
    const doc = new jsPDF({ orientation:'landscape', unit:'px', format:[W,H] });

    let stage = document.getElementById('pdfStage');
    if (!stage) { stage = document.createElement('div'); stage.id='pdfStage'; document.body.appendChild(stage); }
    stage.style.cssText = 'position:fixed;left:-12000px;top:0;width:'+W+'px;height:'+H+'px;overflow:hidden;';

    const rows = [['Client',p.client],['Agency',p.agency],['Solution',p.solution],['Industry',p.industry],['Date',p.date_str||p.year]]
      .filter(([,v]) => v && String(v).trim())
      .map(([k,v]) => `<tr><td style="padding:14px 40px 14px 0;font-size:24px;color:#7c8b91;font-weight:600;white-space:nowrap;vertical-align:top">${k}</td><td style="padding:14px 0;font-size:30px;color:#eef3f5;line-height:1.4">${esc(v)}</td></tr>`).join('');
    const linkRows = (p.links||[]).filter(l => (l.label||'').trim()).map(l => `<div style="font-size:26px;color:#5ac5de;margin-top:14px">${esc(l.label)} ↗</div>`).join('');
    const meta = `<table style="border-collapse:collapse">${rows}</table>${linkRows?`<div style="margin-top:36px">${linkRows}</div>`:''}`;

    const slides = [];
    // 표지
    slides.push(`<div style="width:${W}px;height:${H}px;background:#5ac5de;color:#16232b;font-family:${PFONT};padding:130px 140px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
        <div style="font-weight:800;font-size:200px;line-height:.9;letter-spacing:-.05em">CPT</div>
        <div>
          <div style="font-weight:700;font-size:96px;line-height:1.02;letter-spacing:-.02em">${esc(p.name)||'Campaign'}</div>
          <div style="font-size:40px;margin-top:28px;opacity:.85">${[p.client,p.category,p.year].filter(Boolean).map(esc).join('&nbsp;&nbsp;·&nbsp;&nbsp;')}</div>
        </div>
      </div>`);
    // 정보
    slides.push(`<div style="width:${W}px;height:${H}px;background:#0c1215;color:#eef3f5;font-family:${PFONT};padding:130px 140px;box-sizing:border-box;display:flex;gap:120px">
        <div style="flex:.85">
          <div style="font-weight:700;font-size:72px;line-height:1.05;letter-spacing:-.02em;margin-bottom:60px">${esc(p.name)}</div>
          ${meta}
        </div>
        <div style="flex:1.15;font-size:32px;line-height:1.75;color:#c7d0d4;padding-top:12px">${esc(p.body||'')}</div>
      </div>`);
    // 이미지들 (영상은 PDF에 못 넣어서 제외)
    for (const im of (p.images||[]).filter(m => m.type !== 'video')) {
      slides.push(`<div style="width:${W}px;height:${H}px;background:#0c1215;position:relative;overflow:hidden;font-family:${PFONT}">
          <img src="${im.url}" crossorigin="anonymous" style="width:100%;height:100%;object-fit:cover;display:block">
          ${im.caption?`<div style="position:absolute;left:0;right:0;bottom:0;padding:44px 140px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:34px;font-weight:600">${esc(im.caption)}</div>`:''}
        </div>`);
    }

    for (let i=0; i<slides.length; i++) {
      stage.innerHTML = slides[i];
      const el = stage.firstElementChild;
      await Promise.all([...el.querySelectorAll('img')].map(img => img.complete && img.naturalWidth ? Promise.resolve() : new Promise(r => { img.onload=r; img.onerror=r; })));
      const canvas = await html2canvas(el, { scale:1.6, useCORS:true, backgroundColor:null, width:W, height:H, windowWidth:W, windowHeight:H });
      const data = canvas.toDataURL('image/jpeg', 0.93);
      if (i>0) doc.addPage([W,H],'landscape');
      doc.addImage(data, 'JPEG', 0, 0, W, H);
    }
    stage.innerHTML = '';
    doc.save(`${(p.name||'campaign').replace(/[^\w가-힣]/g,'_')}.pdf`);
  }

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  boot();
</script>
